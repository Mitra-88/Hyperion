name: Hyperion
version: '${project.version}'
main: dev.mitra88.hyperion.Hyperion
api-version: '26.2'
load: STARTUP
authors: [Mitra-88]
description: Hyperion is a Spigot plugin inspired by the Hyperion abilities from the Hypixel Skyblock.
website: https://github.com/Mitra-88/Hyperion
commands:
  givehyperion:
    usage: /givehyperion
    description: Gives the Hyperion item to the player.
permissions:
  hyperion.give:
    default: true
    description: Allows players to use the /givehyperion command.