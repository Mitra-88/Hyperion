name: Hyperion
version: '${project.version}'
main: dev.mitra88.hyperion.Hyperion
api-version: '26.2'
load: STARTUP
authors: [Mitra-88]
description: Hyperion is a plugin inspired by the Hyperion abilities from the Hypixel Skyblock.
website: https://github.com/Mitra-88/Hyperion
commands:
  givehyperion:
    usage: /givehyperion
    description: Gives the Hyperion item to the player.
  hyperionreload:
    usage: /hyperionreload
    description: Reloads the Hyperion configuration.
permissions:
  givehyperion.give:
    default: true
    description: Allows players to use the /givehyperion command.
  hyperion.reload:
    default: op
    description: Allows players to use the /hyperionreload command.